name: Build paper

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply clickable GitHub availability link
        run: python source/apply_github_link_patch.py

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip matplotlib

      - name: Build manuscript figures
        run: python source/build_figures.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-publishers lmodern poppler-utils

      - name: Compile main and supplement
        shell: bash
        run: |
          set -euo pipefail
          cd source
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
          mkdir -p ../paper
          cp main.pdf ../paper/When_AI_Exposure_Rankings_Disagree_Main.pdf
          cp supplement.pdf ../paper/When_AI_Exposure_Rankings_Disagree_Supplement.pdf
          pdfunite main.pdf supplement.pdf ../paper/When_AI_Exposure_Rankings_Disagree_Main_and_Supplement.pdf
          cd ..
          sha256sum paper/*.pdf > GITHUB_BUILD_SHA256.txt
          ! grep -E 'Overfull \\hbox|Overfull \\vbox|undefined references|undefined citation' source/main.log
          ! grep -E 'Overfull \\hbox|Overfull \\vbox|undefined references|undefined citation' source/supplement.log

      - name: Commit final source and generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/main.tex paper source/figures GITHUB_BUILD_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add clickable GitHub data and code link'
            git push
          fi
